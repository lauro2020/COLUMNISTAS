server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API la sirve el contenedor "api". Al ir por el mismo dominio no hay
    # problemas de CORS ni de cookies entre orígenes.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los MP3 pueden tardar en generarse y se sirven por trozos.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # El service worker nunca se cachea: así las actualizaciones llegan.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Los archivos con hash en el nombre sí se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html, en cambio, NUNCA se cachea.
    #
    # Es el que dice qué archivo de /assets/ hay que cargar. Sin esto el
    # navegador se lo queda por su cuenta, y después de reconstruir la app
    # sigue pidiendo el paquete anterior: la versión nueva está servida pero
    # el teléfono nunca la ve, ni siquiera recargando.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Cualquier otra ruta la resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
