server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API la sirve el contenedor "api". Al ir por el mismo dominio no hay
    # problemas de CORS ni de cookies entre orígenes.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los MP3 pueden tardar en generarse y se sirven por trozos.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # El service worker nunca se cachea: así las actualizaciones llegan.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Los archivos con hash en el nombre sí se cachean para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cualquier otra ruta la resuelve React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
